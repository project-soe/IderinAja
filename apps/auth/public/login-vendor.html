<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Masuk atau daftar sebagai Mitra Pedagang IderinAja"
  >

  <title>IderinAja — Mitra Pedagang</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="lmgj-logo.css">
</head>

<body>

  <main
    class="login-screen"
    data-account-type="vendor"
  >

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>


    <header class="login-header">

      <button
        class="back-button"
        id="backButton"
        type="button"
        aria-label="Kembali"
      >
        ←
      </button>

      <a class="mini-brand lmgj-nav-brand" href="account-type.html" aria-label="Kembali ke pilih akun"><span class="lmgj-logo-wrap"><img class="lmgj-logo lmgj-logo--nav" src="assets/lmgj-logo.svg" alt="Logo LMGJ" width="34" height="42"></span><span class="lmgj-wordmark">Iderin<span>Aja</span></span></a>

      <div class="header-spacer"></div>

    </header>


    <section class="login-content">

      <div class="account-symbol vendor-symbol">

        <svg viewBox="0 0 64 64" aria-hidden="true">

          <path
            d="M10 27h44v24H10z"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

          <path
            d="M7 27l5-13h40l5 13"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linejoin="round"
          />

          <path
            d="M7 27c0 5 4 8 9 8s8-3 8-8c0 5 4 8 8 8s8-3 8-8c0 5 4 8 8 8s9-3 9-8"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

          <circle
            cx="21"
            cy="51"
            r="3"
            fill="currentColor"
          />

          <circle
            cx="44"
            cy="51"
            r="3"
            fill="currentColor"
          />

        </svg>

      </div>


      <span class="eyebrow">
        MITRA PEDAGANG
      </span>


      <h1>
        Kelola usaha.<br>
        <span>Lebih mudah.</span>
      </h1>


      <p class="intro-text">
        Masuk atau buat akun untuk mulai mengelola
        lokasi, menu, stok, dan pesananmu.
      </p>


      <div class="auth-actions">

        <button
          class="primary-button"
          type="button"
          data-action="login"
        >
          <span>Masuk</span>
          <span>→</span>
        </button>


        <button
          class="secondary-button"
          type="button"
          data-action="register"
        >
          Buat akun baru
        </button>

      </div>


      <div class="divider">
        <span>atau</span>
      </div>


      <button
        class="phone-button"
        type="button"
        data-action="phone"
      >

        <span class="phone-icon">
          ☎
        </span>

        <span>
          Lanjut dengan nomor HP
        </span>

      </button>


      <p class="terms">
        Dengan melanjutkan, kamu menyetujui
        ketentuan penggunaan dan kebijakan privasi IderinAja.
      </p>

    </section>


    <footer class="login-footer">
      <button
        id="changeAccount"
        type="button"
      >
        ← Pilih jenis akun lain
      </button>
    </footer>

  </main>


  <script src="login.js"></script>

</body>
</html>
