<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Masuk atau daftar sebagai Konsumen IderinAja"
  >

  <title>IderinAja — Konsumen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="login.css"\n  <link rel="stylesheet" href="lmgj-logo.css">>
</head>

<body>

  <main
    class="login-screen"
    data-account-type="customer"
  >

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="login-header">

      <button
        class="back-button"
        id="backButton"
        type="button"
        aria-label="Kembali"
      >
        ←
      </button>

      <a class="mini-brand lmgj-nav-brand" href="account-type.html" aria-label="Kembali ke pilih akun"><span class="lmgj-logo-wrap"><img class="lmgj-logo lmgj-logo--nav" src="assets/lmgj-logo.svg" alt="Logo LMGJ" width="34" height="42"></span><span class="lmgj-wordmark">Iderin<span>Aja</span></span></a>

      <div class="header-spacer"></div>

    </header>


    <section class="login-content">

      <div class="account-symbol customer-symbol">

        <svg viewBox="0 0 64 64" aria-hidden="true">

          <path
            d="M32 57S14 40 14 26
               C14 16 22 8 32 8
               s18 8 18 18
               c0 14-18 31-18 31Z"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

          <circle
            cx="32"
            cy="26"
            r="7"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

        </svg>

      </div>


      <span class="eyebrow">
        KONSUMEN
      </span>


      <h1>
        Temukan pedagang.<br>
        <span>Lebih dekat.</span>
      </h1>


      <p class="intro-text">
        Masuk atau buat akun untuk menemukan pedagang
        di sekitarmu dan memesan dengan mudah.
      </p>


      <div class="auth-actions">

        <button
          class="primary-button"
          type="button"
          data-action="login"
        >
          <span>Masuk</span>
          <span>→</span>
        </button>


        <button
          class="secondary-button"
          type="button"
          data-action="register"
        >
          Buat akun baru
        </button>

      </div>


      <div class="divider">
        <span>atau</span>
      </div>


      <button
        class="phone-button"
        type="button"
        data-action="phone"
      >

        <span class="phone-icon">
          ☎
        </span>

        <span>
          Lanjut dengan nomor HP
        </span>

      </button>


      <p class="terms">
        Dengan melanjutkan, kamu menyetujui
        ketentuan penggunaan dan kebijakan privasi IderinAja.
      </p>

    </section>


    <footer class="login-footer">

      <button
        id="changeAccount"
        type="button"
      >
        ← Pilih jenis akun lain
      </button>

    </footer>

  </main>


  <script src="login.js"></script>

</body>
</html>
