<!DOCTYPE html>
<html lang="id">
<head>
  <!-- =========================================================
       IDERINAJA — AUTH OPENING
       Dedicated SVG intro / boot screen.
       ========================================================= -->
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#09090b">
  <meta
    name="description"
    content="IderinAja — Pedagang Keliling"
  >

  <title>IderinAja — Memuat</title>

  <link rel="stylesheet" href="opening/opening.css">
</head>

<body>
  <main
    id="openingScreen"
    class="opening-screen"
    aria-label="Membuka IderinAja"
  >
    <div class="opening-glow" aria-hidden="true"></div>

    <div class="opening-content">
      <svg
        class="opening-logo"
        viewBox="0 0 520 220"
        role="img"
        aria-label="Logo IderinAja"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient
            id="iderinAjaOpeningGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#3A2211" />
            <stop offset="35%" stop-color="#794824" />
            <stop offset="70%" stop-color="#C28E58" />
            <stop offset="100%" stop-color="#E5BE9D" />
          </linearGradient>

          <linearGradient
            id="iderinAjaOpeningHighlight"
            x1="0%"
            y1="0%"
            x2="0%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#FCEADE" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#B07D4F" stop-opacity="0.3" />
          </linearGradient>
        </defs>

        <g
          fill="none"
          stroke="url(#iderinAjaOpeningGradient)"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            class="opening-logo__path opening-logo__path--01"
            d="M 45 40 L 45 155 C 45 170, 55 180, 75 180 L 95 180 C 110 180, 120 170, 120 155 L 120 90"
            stroke-width="14"
          />
          <path
            class="opening-logo__path opening-logo__path--02"
            d="M 95 90 L 140 160 L 185 85 L 225 155"
            stroke-width="14"
          />
          <path
            class="opening-logo__path opening-logo__path--03"
            d="M 95 90 L 140 160 L 185 85 L 225 155"
            stroke="url(#iderinAjaOpeningHighlight)"
            stroke-width="6"
          />
          <path
            class="opening-logo__path opening-logo__path--04"
            d="M 225 155 C 240 180, 260 185, 280 165 C 300 145, 290 100, 265 85 C 240 70, 215 95, 235 125 C 255 155, 305 160, 345 135"
            stroke-width="14"
          />
          <path
            class="opening-logo__path opening-logo__path--05"
            d="M 330 60 C 370 30, 420 50, 420 95 L 420 185 C 420 205, 395 215, 375 195 C 360 180, 365 165, 385 155"
            stroke-width="14"
          />
          <path
            class="opening-logo__path opening-logo__path--06"
            d="M 45 40 L 45 155"
            stroke="url(#iderinAjaOpeningHighlight)"
            stroke-width="5"
          />
          <path
            class="opening-logo__path opening-logo__path--07"
            d="M 390 95 L 390 175"
            stroke="url(#iderinAjaOpeningHighlight)"
            stroke-width="5"
          />
        </g>
      </svg>

      <p
        class="opening-status"
        role="status"
        aria-live="polite"
      >
        Memuat Pengalaman...
      </p>
    </div>

    <button
      id="openingSkip"
      class="opening-skip"
      type="button"
      aria-label="Lewati intro IderinAja"
    >
      Lewati
    </button>

    <noscript>
      <p>
        JavaScript diperlukan untuk melanjutkan.
        <a href="account-type.html">Buka IderinAja</a>
      </p>
    </noscript>
  </main>

  <script src="opening/opening.js" defer></script>
</body>
</html>
